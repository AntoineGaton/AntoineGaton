<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
<title id="t">Canopy architecture</title>
<desc id="d">Pocket clients and the Canopy PWA talk to the Canopy host. Understory tracks work as a state machine mirrored to GitHub Issues. Ranger dispatches ready items to Claude Code agent tabs, one herdr workspace per project. Agents open pull requests; merges flow back into Understory.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect width="1280" height="560" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<text x="40" y="52" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:28px;font-weight:800" fill="#1f2328">Canopy</text>
<text x="160" y="52" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px" fill="#59636e">a one-person software studio run by a crew of AI agents</text>
<rect x="300" y="88" width="950" height="300" rx="14" fill="none" stroke="#d0d7de" stroke-width="2" stroke-dasharray="8 6"/>
<text x="320" y="114" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;letter-spacing:1px" fill="#59636e">CANOPY HOST</text>
<text x="40" y="114" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;letter-spacing:1px" fill="#59636e">CLIENTS</text>
