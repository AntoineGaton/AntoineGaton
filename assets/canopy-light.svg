<text x="945.0" y="210" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px" fill="#59636e">Claude Code, one</text>
<text x="945.0" y="231" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px" fill="#59636e">per project, in</text>
<text x="945.0" y="252" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px" fill="#59636e">herdr workspaces</text>
<text x="945.0" y="273" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px" fill="#59636e">(git worktrees)</text>
