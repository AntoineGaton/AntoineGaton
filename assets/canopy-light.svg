<text x="56" y="170" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#59636e">Pi Zero 2 W pager, voice-first</text>
<rect x="40" y="192" width="220" height="50" rx="10" fill="#f6f8fa" stroke="#bc4c00" stroke-width="2"/>
