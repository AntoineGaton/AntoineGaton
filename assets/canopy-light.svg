<text x="882" y="430" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700" fill="#1f2328">Seeder</text>
<text x="882" y="452" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px" fill="#59636e">drafts epics and stories for Understory</text>
<text x="40" y="520" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px" fill="#59636e">Every item: draft → ready → in progress → PR → merged. Workers get repo-scoped bot tokens; nothing merges without review.</text>
