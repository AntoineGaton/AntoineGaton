<text x="56" y="276" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;font-weight:700" fill="#1f2328">Trailhead</text>
<text x="56" y="294" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12.5px" fill="#59636e">Raspberry Pi 4 deck</text>
