<text x="695.0" y="210" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px" fill="#59636e">dispatcher:</text>
<text x="695.0" y="231" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px" fill="#59636e">picks ready items,</text>
<text x="695.0" y="252" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px" fill="#59636e">gates on blockers</text>
