<text x="695.0" y="210" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px" fill="#8b949e">dispatcher:</text>
<text x="695.0" y="231" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px" fill="#8b949e">picks ready items,</text>
