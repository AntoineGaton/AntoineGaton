<text x="40" y="520" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px" fill="#8b949e">Every item: draft → ready → in progress → PR → merged. Workers get repo-scoped bot tokens; nothing merges without review.</text>
