<text x="945.0" y="231" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px" fill="#8b949e">per project, in</text>
<text x="945.0" y="252" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px" fill="#8b949e">herdr workspaces</text>
